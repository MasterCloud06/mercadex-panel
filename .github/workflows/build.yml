name: build

on:
  push:
    branches: [ main, develop, 'feature/**', 'fix/**' ]
  pull_request:

jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Revisar tipos y compilar
        run: npm run build
